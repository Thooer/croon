[workspace]
resolver = "3"
members = [
    "crates/spec",
    "crates/eval",
    "crates/kernel",
    "crates/scenarios",
]
exclude = []

[workspace.package]
version = "0.0.0"
edition = "2024"
rust-version = "1.99"
publish = false

[workspace.dependencies]
serde_json = { version = "1", default-features = false, features = ["std", "float_roundtrip"] }
sha2 = { version = "0.11", default-features = false }
thiserror = { version = "2", default-features = false }
toml = { version = "1.1.6", default-features = false, features = ["parse", "serde", "std"] }
tokio = { version = "1", default-features = false, features = ["rt-multi-thread", "macros", "signal", "time", "sync"] }
tracing = { version = "0.1", default-features = false }
tracing-subscriber = { version = "0.3", default-features = false }
rusqlite = { version = "0.41", default-features = false, features = ["bundled"] }
tiktoken-rs = { version = "=0.12.1", default-features = false }
pulldown-cmark = { version = "0.13.5", default-features = false }

[profile.release]
overflow-checks = true
